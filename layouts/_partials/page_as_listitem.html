<li>
  {{/* コンテンツの最終更新日時とタグ */}}
  <a href="{{ .Permalink }}">{{ .Title }}</a> | <span class="lastmod">{{ .Lastmod.Format "2006-01-02 15:04:05" }}</span>
  {{ with .GetTerms "tags" }}
    {{ range . }}
      <span class="tag"><a href="{{ .RelPermalink  }}">{{ .LinkTitle }}</a></span>
    {{ end }}
  {{ end }}

  {{/* コンテンツのサマリー (<!--more--> までの文章) */}}
  {{ .Summary }}

  <p class="readmore"><a href="{{ .Permalink }}">&laquo; more &raquo;</a></p>
  <hr class="listsep" />
</li>
{{/* vim: set et ft=html sts=2 sw=2 ts=2 : */}}
