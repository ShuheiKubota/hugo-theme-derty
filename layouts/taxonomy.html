{{ define "main" }}
  {{/* 分類自身の内容 */}}
  <h1>{{ .Title }}</h1>
  {{ .Content }}

  {{/* ページネーション */}}
  <div class="list_container">
    <ul>
      {{ range .Paginator.Pages }}
        {{ partial "page_as_listitem.html" . }}
      {{ end }}
    </ul>
    {{ partial "pagination.html" . }}
  </div>
{{ end }}
